name: consul

services:
  consul:
    image: hashicorp/consul:1.22
    # restart: unless-stopped

    command:
      - agent
      - -server
      - -ui
      - -node=consul-server
      # 本機開發使用單節點 server。
      - -bootstrap-expect=1
      - -client=0.0.0.0
      - -data-dir=/consul/data

    ports:
      - "127.0.0.1:${CONSUL_HTTP_PORT}:8500"
      - "127.0.0.1:${CONSUL_DNS_PORT}:8600/tcp"
      - "127.0.0.1:${CONSUL_DNS_PORT}:8600/udp"

    volumes:
      - consul-data:/consul/data

    healthcheck:
      test: ["CMD", "consul", "operator", "raft", "list-peers"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  consul-data:
