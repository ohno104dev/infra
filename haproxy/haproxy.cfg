# 請求流程：用戶端 → frontend http → backend app → 後端服務。
# 修改此檔案後，需重新載入或重新啟動 HAProxy 才會生效。

# 程序層級設定。
global
    # 將日誌輸出至容器 stdout，可使用 docker compose logs haproxy 查看。
    # raw 表示不加上 syslog 格式的標頭；local0 是日誌分類。
    log stdout format raw local0
    # 此 HAProxy 程序最多同時處理 2048 個用戶端連線。
    maxconn 2048

# 下方 frontend / backend 共用的預設值，也可在各區塊內覆寫。
defaults
    # 沿用 global 定義的日誌輸出位置。
    log global
    # 使用 HTTP 模式，解析 HTTP 請求與回應。
    mode http
    # 使用 HTTP 日誌格式，記錄請求、狀態碼與處理時間等資訊。
    option httplog
    # 建立後端連線的最長等待時間。
    timeout connect 5s
    # 用戶端連線的閒置逾時；不是整個請求的總時間上限。
    timeout client 30s
    # 後端連線的閒置逾時。
    timeout server 30s

# 對外接收 HTTP 請求的入口；http 是此 frontend 的名稱。
frontend http
    # Compose 將 .env 設定傳入容器；環境變數需放在雙引號內。
    bind ":${HAPROXY_PORT}"
    # 將請求送至名稱為 app 的 backend。
    default_backend app

# 後端服務群組；目前留空，送到這裡的請求會回傳 503。
backend app
    # 有後端服務時，取消下方註解並修改位址即可。
    # roundrobin：將請求輪流分配給可用的後端。
    # balance roundrobin

    # 共用健康檢查參數：每 5 秒檢查，連續失敗 3 次標記為不可用，
    # 連續成功 2 次恢復可用；server 上仍需加 check 才會啟用檢查。
    # default-server inter 5s fall 3 rise 2

    # 格式：server <自訂名稱> <主機名稱或 IP>:<port> check
    # host.docker.internal 指向執行 Docker 的電腦。
    # 預設 check 只檢查 TCP 是否可連線，不會檢查 HTTP 回應內容。
    # server app-1 host.docker.internal:8081 check
    # server app-2 host.docker.internal:8082 check

    # 若應用程式也是同一個 Docker network 的容器，可改用服務名稱：
    # server app-1 web:8080 check

# 獨立的監控入口。
frontend stats
    # 監控入口使用 Compose 傳入的環境變數。
    bind ":${HAPROXY_STATS_PORT}"
    # /health 由 HAProxy 直接回覆，供 Compose healthcheck 使用。
    # 這只確認 HAProxy 能回應，不代表 backend app 有可用服務。
    monitor-uri /health
    # 啟用內建統計頁面。
    stats enable
    # 統計頁面路徑：http://127.0.0.1:<HAPROXY_STATS_PORT>/stats。
    stats uri /stats
    # 統計頁面每 5 秒自動重新整理。
    stats refresh 5s
