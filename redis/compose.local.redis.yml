name: redis-cluster
services:
  redis1:
    image: redis:8
    # restart: unless-stopped
    network_mode: host

    environment:
      # Used by redis-cli for authentication to avoid exposing the password in command-line arguments.
      REDISCLI_AUTH: ${REDIS_PASSWORD}

    command:
      - redis-server

      - --port
      - "6379"

      # Authentication
      # `requirepass` sets the password for the built-in `default` user.
      # To use a custom username, configure Redis ACL.
      - --requirepass
      - ${REDIS_PASSWORD}

      # Enable redis cluster
      - --cluster-enabled 
      - "yes"

      # Redis-managed cluster state file
      - --cluster-config-file 
      - "nodes.conf"

      # Consider a node unavailable after 5 sec
      - --cluster-node-timeout 
      - "5000"

      # Disable AOF persistence
      - --appendonly 
      - "no"

      # Disable RDB snapshots
      - --save 
      - ""

      # Advertised address for cluster clients
      - --cluster-announce-ip 
      - 127.0.0.1
      - --cluster-announce-port 
      - "6379"
      - --cluster-announce-bus-port 
      - "16379"

    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis2:
    image: redis:8
    # restart: unless-stopped
    network_mode: host

    environment:
      # Used by redis-cli for authentication to avoid exposing the password in command-line arguments.
      REDISCLI_AUTH: ${REDIS_PASSWORD}

    command:
      - redis-server

      - --port
      - "6380"

      # Authentication
      # `requirepass` sets the password for the built-in `default` user.
      # To use a custom username, configure Redis ACL.
      - --requirepass
      - ${REDIS_PASSWORD}

      # Enable Redis Cluster
      - --cluster-enabled
      - "yes"

      # Redis-managed cluster state file
      - --cluster-config-file
      - nodes.conf

      # Consider a node unavailable after 5 seconds
      - --cluster-node-timeout
      - "5000"

      # Disable AOF persistence
      - --appendonly
      - "no"

      # Disable RDB snapshots
      - --save
      - ""

      # Advertised address for cluster clients
      - --cluster-announce-ip
      - 127.0.0.1
      - --cluster-announce-port
      - "6380"
      - --cluster-announce-bus-port
      - "16380"

    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis3:
    image: redis:8
    # restart: unless-stopped
    network_mode: host

    environment:
      # Used by redis-cli for authentication to avoid exposing the password in command-line arguments.
      REDISCLI_AUTH: ${REDIS_PASSWORD}

    command:
      - redis-server

      - --port
      - "6381"

      # Authentication
      # `requirepass` sets the password for the built-in `default` user.
      # To use a custom username, configure Redis ACL.
      - --requirepass
      - ${REDIS_PASSWORD}

      # Enable Redis Cluster
      - --cluster-enabled
      - "yes"

      # Redis-managed cluster state file
      - --cluster-config-file
      - nodes.conf

      # Consider a node unavailable after 5 seconds
      - --cluster-node-timeout
      - "5000"

      # Disable AOF persistence
      - --appendonly
      - "no"

      # Disable RDB snapshots
      - --save
      - ""

      # Advertised address for cluster clients
      - --cluster-announce-ip
      - 127.0.0.1
      - --cluster-announce-port
      - "6381"
      - --cluster-announce-bus-port
      - "16381"

    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis-cluster-init:
    image: redis:8
    restart: "no"
    network_mode: host

    depends_on:
      redis1:
        condition: service_healthy
      redis2:
        condition: service_healthy
      redis3:
        condition: service_healthy

    environment:
      # Used by redis-cli for authentication to avoid exposing the password in command-line arguments.
      REDISCLI_AUTH: ${REDIS_PASSWORD}

    entrypoint:
      - /bin/sh
      - -c
      - |
        redis-cli --cluster create \
          127.0.0.1:6379 \
          127.0.0.1:6380 \
          127.0.0.1:6381 \
          --cluster-replicas 0 \
          --cluster-yes